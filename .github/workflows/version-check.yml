name: Version Check

on:
  push:
    tags: ['v*']

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version header matches tag
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "Expected version: $VERSION"

          for file in src/*.workshop; do
            if ! grep -qF "$VERSION" "$file"; then
              echo "::error file=$file::Version header does not contain $VERSION"
              exit 1
            fi
          done

          echo "Version header matches tag ✓"